name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the IndexNow step can diff against the previous deployment.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static site
        # For a project site (https://<user>.github.io/<repo>/) set:
        #   BASE_PATH: /<repo>/
        env:
          GITHUB_PAGES: "true"
          BASE_PATH: /
          # GA4 measurement ID (G-XXXX), stored as a GitHub Actions secret.
          VITE_GA_MEASUREMENT_ID: ${{ secrets.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow runs only after a successful deployment. It notifies
      # participating search engines of genuinely changed public URLs.
      # continue-on-error: an IndexNow failure must never fail the deploy.
      - name: Submit changed URLs to IndexNow
        if: success()
        continue-on-error: true
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            node scripts/indexnow-submit.mjs --changed "$BEFORE_SHA" "${{ github.sha }}"
          else
            echo "No previous deployment SHA (manual run or first push) — skipping IndexNow"
          fi
